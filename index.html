<!-- Tabs -->
<div class="flex gap-2 mb-4 overflow-x-auto">
  <button onclick="switchTab('dash')" id="tab-dash" class="tab-btn px-4 py-2 rounded-full font-semibold whitespace-nowrap">📊 Dashboard</button>
  <button onclick="switchTab('expenses')" id="tab-expenses" class="tab-btn px-4 py-2 rounded-full font-semibold whitespace-nowrap">📝 รายการเดือนนี้</button>
  <button onclick="switchTab('templates')" id="tab-templates" class="tab-btn px-4 py-2 rounded-full font-semibold whitespace-nowrap">📋 รายการประจำ</button>
  <button onclick="switchTab('report')" id="tab-report" class="tab-btn px-4 py-2 rounded-full font-semibold whitespace-nowrap">📈 รายงาน</button>
</div>

<!-- ===== PAGE: EXPENSES ===== -->
<div id="page-expenses" class="hidden">

  <!-- สรุปยอด -->
  <div id="expenseSummary" class="grid grid-cols-3 gap-2 mb-4"></div>

  <!-- ฟอร์มเพิ่ม -->
  <div class="card bg-white rounded-xl p-4 shadow mb-4">
    <h3 class="font-bold mb-3">➕ เพิ่มรายการใหม่ (เดือนนี้)</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-2">
      <input id="newTitle" placeholder="ชื่อรายการ" class="border rounded-lg px-3 py-2 col-span-2 text-sm">
      <input id="newAmount" type="number" placeholder="จำนวนเงิน" class="border rounded-lg px-3 py-2 text-sm">
      <select id="newCategory" class="border rounded-lg px-3 py-2 text-sm"></select>
      <input id="newDueDay" type="number" min="1" max="31" placeholder="วันครบกำหนด" class="border rounded-lg px-3 py-2 text-sm col-span-2">
      <button onclick="addNewCategory()" class="text-xs bg-slate-200 dark:bg-slate-600 rounded-lg px-3 py-2">➕ หมวดหมู่ใหม่</button>
    </div>
    <button onclick="addExpense()" class="w-full md:w-auto bg-gradient-to-r from-blue-500 to-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:shadow-lg transition">
      บันทึก
    </button>
  </div>

  <!-- ตัวกรอง -->
  <div class="card bg-white rounded-xl p-3 shadow mb-4 flex flex-wrap gap-2">
    <select id="filterMonth" onchange="renderExpensesPage()" class="border rounded-lg px-3 py-1 text-sm"></select>
    <select id="filterStatus" onchange="renderExpensesPage()" class="border rounded-lg px-3 py-1 text-sm">
      <option value="">ทุกสถานะ</option>
      <option value="paid">✅ จ่ายแล้ว</option>
      <option value="pending">⏳ รอจ่าย</option>
      <option value="overdue">⚠️ เลยกำหนด</option>
    </select>
  </div>

  <!-- รายการแยกหมวดหมู่ -->
  <div id="list"></div>
</div>

<!-- ===== PAGE: TEMPLATES ===== -->
<div id="page-templates" class="hidden">

  <!-- ปุ่มสร้างรายการทั้งเดือน -->
  <div class="card bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl p-4 shadow mb-4">
    <h3 class="font-bold mb-2">🚀 สร้างรายการของเดือนจากแม่แบบ</h3>
    <p class="text-xs opacity-90 mb-3">ดึงรายการทั้งหมดด้านล่างมาสร้างเป็นรายการของเดือนที่เลือก</p>
    <div class="flex flex-wrap gap-2">
      <select id="genMonth" class="text-slate-800 rounded-lg px-3 py-2 text-sm"></select>
      <select id="genYear" class="text-slate-800 rounded-lg px-3 py-2 text-sm"></select>
      <button onclick="generateMonth()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold text-sm hover:bg-blue-50">
        ✨ สร้างเลย
      </button>
    </div>
  </div>

  <!-- ฟอร์มเพิ่มแม่แบบ -->
  <div class="card bg-white rounded-xl p-4 shadow mb-4">
    <h3 class="font-bold mb-3">➕ เพิ่มแม่แบบรายการ</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-2">
      <input id="tplTitle" placeholder="ชื่อรายการ" class="border rounded-lg px-3 py-2 col-span-2 text-sm">
      <input id="tplAmount" type="number" placeholder="จำนวนเงินเริ่มต้น" class="border rounded-lg px-3 py-2 text-sm">
      <select id="tplCategory" class="border rounded-lg px-3 py-2 text-sm"></select>
      <input id="tplDueDay" type="number" min="1" max="31" placeholder="วันครบกำหนด" class="border rounded-lg px-3 py-2 text-sm col-span-2">
    </div>
    <button onclick="addTemplate()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold">บันทึก</button>
  </div>

  <!-- รายการแม่แบบ -->
  <div id="templateList"></div>
</div>
